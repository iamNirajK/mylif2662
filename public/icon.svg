<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#14192b" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)" />
  
  <!-- Outer Neural Orbital Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="16 12" stroke-linecap="round" />
  
  <!-- Central JIYA Monogram Core (Stylized J & Spark of Life) -->
  <g transform="translate(256, 256)">
    <!-- Dynamic orbital arcs -->
    <path d="M -90,-40 C -70,-110 70,-110 90,-40 C 110,30 30,110 -60,95 C -100,85 -110,45 -90,15" 
          stroke="url(#coreGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Radiant Diamond Spark -->
    <path d="M 0,-70 Q 15,-15 70,0 Q 15,15 0,70 Q -15,15 -70,0 Q -15,-15 0,-70 Z" 
          fill="url(#coreGrad)" filter="url(#glow)" />
    <!-- Pure Center Nucleus -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <!-- Secondary satellite nodes -->
    <circle cx="95" cy="-35" r="8" fill="#38bdf8" />
    <circle cx="-60" cy="95" r="7" fill="#c084fc" />
    <circle cx="-90" cy="-40" r="6" fill="#818cf8" />
  </g>
</svg>
